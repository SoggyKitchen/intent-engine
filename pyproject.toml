[project]
name = "intent-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "praw>=7.8.0",
    "httpx>=0.27.0",
    "groq>=0.11.0",
    "google-generativeai>=0.8.0",
    "feedparser>=6.0.11",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "click>=8.1.7",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "openai>=1.40.0",
    "markdown>=3.7",
    "python-slugify>=8.0.4",
    "schedule>=1.2.2",
    "pytest>=9.0.3",
    "openpyxl>=3.1.5",
]

[project.scripts]
engine = "ops.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "scorer", "llm", "outputs", "publisher", "learn", "ops"]
