<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1270px;height:760px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%)}
  .container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:60px;text-align:center}
  .badge{background:rgba(233,69,96,0.2);border:1px solid #e94560;color:#e94560;padding:6px 18px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:.5px;margin-bottom:28px}
  h1{font-size:58px;font-weight:800;color:#fff;line-height:1.1;margin-bottom:20px}
  h1 span{color:#e94560}
  p{font-size:22px;color:#8899aa;max-width:700px;line-height:1.5;margin-bottom:48px}
  .stats{display:flex;gap:60px}
  .stat strong{display:block;font-size:38px;font-weight:800;color:#fff}
  .stat span{font-size:14px;color:#667788;margin-top:4px;display:block}
  .url{margin-top:48px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#aabbcc;padding:10px 24px;border-radius:8px;font-size:15px}
</style>
</head>
<body>
<div class="container">
  <div class="badge">🚀 Launching on Product Hunt</div>
  <h1>Compare B2B SaaS tools.<br><span>Without the guesswork.</span></h1>
  <p>Unbiased comparisons, real pricing and honest verdicts for 500+ business software tools — updated weekly.</p>
  <div class="stats">
    <div class="stat"><strong>500+</strong><span>Tool comparisons</span></div>
    <div class="stat"><strong>16</strong><span>SaaS categories</span></div>
    <div class="stat"><strong>$0</strong><span>Always free</span></div>
  </div>
  <div class="url">saaspare.org</div>
</div>
</body>
</html>
