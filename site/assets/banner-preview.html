<!-- Download button -->
<script>
function downloadSVG() {
  const svg = document.querySelector('svg');
  const blob = new Blob([svg.outerHTML], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'saaspare-88x31.svg';
  a.click();
}
</script>
<button onclick="downloadSVG()" style="padding:8px 16px;background:#ff416d;color:white;border:none;border-radius:4px;cursor:pointer;font-weight:bold;">Download SVG</button>
