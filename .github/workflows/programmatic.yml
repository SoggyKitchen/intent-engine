name: Programmatic SEO

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to generate'
        default: '110'
  # PAUSED 2026-06-16 — indexing-cliff recovery. Generating up to 550 thin
  # programmatic pages/day (5x110) while Google had deindexed ~975 pages was
  # the root cause of the June-1 impressions cliff AND of non-recovery
  # (consolidation > expansion until the GSC "indexed" count climbs back).
  # Re-enable by uncommenting the schedule below once recovery is confirmed
  # (target review ~2026-07-07). Manual runs still available via workflow_dispatch.
  # schedule:
  #   - cron: "0 0,5,10,15,20 * * *"  # 5x daily every 5h (UTC) = 10am,3pm,8pm,1am,6am Brisbane

concurrency:
  group: intent-engine-stateful
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  programmatic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Init database
        run: uv run engine init
        env:
          DB_PATH: data/intent.db

      - name: Run programmatic SEO
        run: uv run engine programmatic --max-pages ${{ github.event.inputs.max_pages || '110' }}
        env:
          DB_PATH: data/intent.db
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
          CEREBRAS_API_KEY_6: ${{ secrets.CEREBRAS_API_KEY_6 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
          CF_PAGES_REPO: ${{ secrets.CF_PAGES_REPO }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          BLOCK_ON_PROG: "false"
          LOG_LEVEL: INFO
          NODE_OPTIONS: --max-old-space-size=2400

      - name: Validate affiliate redirects
        run: uv run python scripts/validate_affiliate_urls.py
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          VALIDATE_LIVE_REDIRECTS: "false"

      - name: Submit backlinks + IndexNow
        run: uv run engine backlinks
        continue-on-error: true
        env:
          DB_PATH: data/intent.db
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Refresh YouTube bridge manifest
        run: uv run engine youtube-bridge
        continue-on-error: true
        env:
          DB_PATH: data/intent.db
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}

      # --- repo-native self-healing cascade --------------------------------
      - name: Repair any corrupted titles / trust-box sentences
        run: uv run python scripts/fix_corrupted_titles.py

      - name: Normalise per-page methodology copy
        run: uv run python scripts/normalise_methodology_copy.py

      - name: Sync public KPI counters
        run: uv run python scripts/sync_public_kpis.py

      - name: Inject intent-weighted journey links
        run: uv run python scripts/inject_journey_links.py

      - name: Flag any risky factual claims
        run: uv run python scripts/flag_risky_claims.py

      - name: Rebuild sitemap after new pages
        run: uv run python scripts/fix_jsonld_sitemap.py

      - name: CI gate - title / trust-box corruption
        run: uv run pytest tests/test_normalise.py -v

      - name: CI gate - SEO integrity
        run: uv run pytest tests/test_seo_integrity.py -v

      - name: Commit pages
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git pull --rebase --autostash origin main
          git add data/intent.db data/affiliate_url_report.md data/public_kpis.json outputs/seo/ site/pages/ site/sitemap.xml site/index.html site/_redirects site/feed.xml site/about.html site/media-kit.html site/assets/ || true
          git diff --staged --quiet || git commit -m "chore: programmatic SEO + self-heal $(date -u +%Y-%m-%d) [skip ci]"
          git push
