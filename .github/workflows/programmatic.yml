name: Programmatic SEO

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to generate'
        default: '500'
  schedule:
    - cron: "0 1 * * *"   # Every day 1 AM UTC

jobs:
  programmatic:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run programmatic SEO
        run: uv run engine programmatic --max-pages ${{ github.event.inputs.max_pages || '80' }}
        env:
          DB_PATH: data/intent.db
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          CF_PAGES_REPO: ${{ secrets.CF_PAGES_REPO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          LOG_LEVEL: INFO

      - name: Commit pages
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git add data/intent.db site/pages/ || true
          git diff --staged --quiet || git commit -m "chore: programmatic SEO $(date -u +%Y-%m-%d) [skip ci]"
          git push
