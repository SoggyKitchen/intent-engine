name: Programmatic SEO

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to generate'
        default: '8'
  schedule:
    - cron: "0 0,6,12,18 * * *"   # 4x daily every 6h — spreads 100k daily token budget safely

jobs:
  programmatic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Init database
        run: uv run engine init
        env:
          DB_PATH: data/intent.db

      - name: Run programmatic SEO
        run: uv run engine programmatic --max-pages ${{ github.event.inputs.max_pages || '8' }}
        continue-on-error: true
        env:
          DB_PATH: data/intent.db
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          CF_PAGES_REPO: ${{ secrets.CF_PAGES_REPO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          LOG_LEVEL: INFO

      - name: Commit pages
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git add data/intent.db site/pages/ site/sitemap.xml || true
          git diff --staged --quiet || git commit -m "chore: programmatic SEO $(date -u +%Y-%m-%d) [skip ci]"
          git push
