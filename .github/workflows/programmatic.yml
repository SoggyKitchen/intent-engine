name: Programmatic SEO

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to generate'
        default: '50'
  schedule:
    - cron: "0 0,5,10,15,20 * * *"  # 5x daily every 5h (UTC) = 10am,3pm,8pm,1am,6am Brisbane

jobs:
  programmatic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Init database
        run: uv run engine init
        env:
          DB_PATH: data/intent.db

      - name: Run programmatic SEO
        run: uv run engine programmatic --max-pages ${{ github.event.inputs.max_pages || '50' }}
        continue-on-error: true
        env:
          DB_PATH: data/intent.db
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          CF_PAGES_REPO: ${{ secrets.CF_PAGES_REPO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          LOG_LEVEL: INFO

      - name: Submit backlinks + IndexNow
        run: uv run engine backlinks
        continue-on-error: true
        env:
          DB_PATH: data/intent.db
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Commit pages
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git add data/intent.db site/pages/ site/sitemap.xml site/_redirects || true
          git diff --staged --quiet || git commit -m "chore: programmatic SEO $(date -u +%Y-%m-%d) [skip ci]"
          git push
