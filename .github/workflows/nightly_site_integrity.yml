name: Nightly site integrity audit

on:
  # Run every night at 03:17 UTC (~1pm AEST) so reports are ready before
  # the author starts the day.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "site/**/*.html"
      - "scripts/**/*.py"
      - "publisher/**/*.py"
      - "tests/test_normalise.py"
      - "tests/test_seo_integrity.py"

permissions:
  contents: write

env:
  # Use Node.js 24 for all actions (required before June 16 2026 deadline)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # 1. Self-healing: remove any "Xero vs. Sageero" style corruption
      # and any "Last verified: <title> is checked..." trust-box bug
      # that sneaks in from content refreshes. Produces a report JSON.
      - name: Repair known corruption patterns
        run: uv run python scripts/fix_corrupted_titles.py

      # 2. Normalise public KPI counts so homepage/about/library/media-kit
      # don't drift out of sync again.
      - name: Sync public KPI counters
        run: uv run python scripts/sync_public_kpis.py

      # 3. Re-apply journey-link block to any new page.
      - name: Inject intent-weighted journey links
        run: uv run python scripts/inject_journey_links.py

      # 4. Flag risky factual claims so the editor has a queue.
      - name: Flag risky factual claims
        run: uv run python scripts/flag_risky_claims.py

      # 4b. Keep Amazon Associates links correct (idempotent, safe to re-run).
      - name: Fix Amazon Associates links
        run: uv run python scripts/fix_amazon_links.py

      # 4c. Strip fake aggregateRating, consolidate duplicate canonicals,
      # ensure ph-preview pages stay noindex'd (idempotent).
      - name: SEO consolidation pass
        run: uv run python scripts/seo_consolidate.py

      # 4d. CTR + position blast: rewrite stale titles/descs, refresh
      # dateModified, add featured-answer boxes for AI-Overview / snippet
      # capture, then ping IndexNow so changes get re-crawled within hours.
      - name: Blast off (CTR + AEO)
        run: uv run python scripts/blast_off.py

      # 4e. Kill orphan pages — every money page gets 5 contextually
      # relevant internal links (same tool, same vertical, same page kind).
      - name: Internal links pass
        run: uv run python scripts/internal_links.py --seed 42

      # 4f. Site-wide upgrade: sitemap changefreq, homepage mega-schema,
      # manifest, Clarity, exit-intent newsletter, lazy-loading, OG preload.
      - name: Site upgrade pass
        run: uv run python scripts/site_upgrade.py

      # 4g. Rebuild /llms-full.txt — dense LLM-readable index.
      - name: Build llms-full.txt
        run: uv run python scripts/build_llms_full.py

      # 4h. Schema pro pass — add SoftwareApplication, Review, HowTo,
      # ItemList schemas + visible affiliate disclosure pill above-fold.
      - name: Schema pro pass
        run: uv run python scripts/schema_pro.py

      # 4h-2. AggregateRating on review pages → star ratings in SERPs.
      - name: Add AggregateRating to review pages
        run: uv run python scripts/fix_aggregate_rating.py

      # 4h-3. ItemList schema on alternatives/best pages → list rich results.
      - name: Add ItemList schema to list pages
        run: uv run python scripts/fix_itemlist_schema.py

      # 4h-3b. Re-apply design fixes (footer logo, real data) after nightly mutations.
      - name: Re-apply design page fixes
        run: uv run python scripts/fix_design_pages.py
        continue-on-error: true

      # 4h-3c. Fix body.sp-bg scroll/click freeze + wrap bare JSON-LD in script tags.
      # The engine regenerates pages with class="sp-bg" on <body> which applies
      # position:fixed + pointer-events:none from saaspare-v2.css, freezing all
      # scrolling and clicks. Also wraps any bare JSON objects in proper script tags.
      - name: Fix body scroll freeze and bare JSON-LD
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          SITE = Path('site')
          fixed_body = 0
          fixed_json = 0
          for fp in list(SITE.glob('pages/*.html')) + list(SITE.glob('blog/*.html')) + list(SITE.glob('authors/*.html')):
              try:
                  content = fp.read_text(encoding='utf-8', errors='replace')
                  original = content
                  # Remove class="sp-bg" from body (causes position:fixed + pointer-events:none)
                  content = re.sub(r'(<body[^>]*)\s+class="sp-bg"([^>]*>)', r'\1\2', content)
                  content = re.sub(r'<body\s+class="sp-bg"(\s+style="[^"]*")?', lambda m: f'<body{m.group(1) or ""}', content)
                  # Wrap bare JSON-LD in proper script tags
                  lines = content.split('\n')
                  new_lines = []
                  in_head = False
                  in_script = False
                  for line in lines:
                      if '<head' in line.lower(): in_head = True
                      if '</head>' in line.lower(): in_head = False
                      if '<script' in line.lower(): in_script = True
                      if '</script>' in line.lower(): in_script = False
                      stripped = line.strip()
                      if in_head and not in_script and stripped.startswith('{"@context":"https://schema.org"') and not stripped.startswith('<'):
                          pad = ' ' * (len(line) - len(line.lstrip()))
                          new_lines.append(f'{pad}<script type="application/ld+json">{stripped}</script>')
                          fixed_json += 1
                      else:
                          new_lines.append(line)
                  content = '\n'.join(new_lines)
                  if content != original:
                      fp.write_text(content, encoding='utf-8')
                      fixed_body += 1
              except Exception as e:
                  pass
          print(f'Fixed scroll/click freeze + JSON-LD on {fixed_body} pages ({fixed_json} bare JSON blocks wrapped)')
          PYEOF
        continue-on-error: true

      # 4h-4. Ensure blog posts exist for all blog index links.
      - name: Create any missing blog posts
        run: uv run python scripts/create_missing_blog_posts.py

      # 4h-5. Sync sitemap with category hubs and new blog posts.
      - name: Update sitemap with new pages
        run: uv run python scripts/update_sitemap_hubs.py

      # 4h-5b. Full sitemap rebuild including blog/ and authors/ subdirs.
      # This is the permanent fix for the recurring sitemap blindspot that was
      # leaving 15+ E-E-A-T pages invisible to Google (blog posts, author page).
      # Also submits to IndexNow so Google recrawls within hours.
      - name: Rebuild full sitemap (blog + authors) + IndexNow
        run: uv run python scripts/update_sitemap_and_index.py
        continue-on-error: true

      # 4h-5c. SEO consolidation — noindex duplicate coupon/promo pairs,
      # fix canonical conflicts from 2025/2026 page duplication.
      - name: SEO consolidation (deduplicate canonicals)
        run: uv run python scripts/seo_consolidate.py
        continue-on-error: true

      # 4h-5d. Re-apply GA4 affiliate_click tracking to any new pages that
      # don't already have it. Ensures every /go/ link fires an analytics event.
      - name: Re-apply affiliate click tracking
        run: |
          python3 << 'PYEOF'
          import pathlib, re
          SITE = pathlib.Path('site')
          MARKER = 'affiliate_click_tracking_v1'
          JS = '''<script>/* ''' + MARKER + ''' */
          (function(){function fireAffClick(h){var s=(h.match(/\\/go\\/([^?#]+)/)||[])[1]||'unknown';if(window.gtag){gtag('event','affiliate_click',{tool_slug:s,page_path:window.location.pathname,link_href:h});}}
          document.addEventListener('click',function(e){var a=e.target.closest('a[href*="/go/"]');if(a){fireAffClick(a.getAttribute('href'));}},{capture:true,passive:true});})();
          </script>'''
          n = 0
          for base in [SITE/'pages', SITE/'blog', SITE]:
            glob = '*.html' if base != SITE else '*.html'
            for p in base.glob(glob):
              try: html = p.read_text(encoding='utf-8', errors='replace')
              except: continue
              if '/go/' not in html or MARKER in html: continue
              p.write_text(html.replace('</body>', JS + '\n</body>', 1), encoding='utf-8')
              n += 1
          print(f'Affiliate tracking applied to {n} new pages')
          PYEOF
        continue-on-error: true

      # 4h-6. Quick Answer blocks + Speakable schema + author bylines on
      # pricing history pages (AEO — makes these pages citable by AI search).
      - name: AEO pass — pricing history quick answers
        run: uv run python scripts/fix_pricing_history_aeo.py

      # 4h-7. Build any missing tool clusters (pricing/review/trial/vs pages).
      - name: Build missing tool clusters
        run: uv run python scripts/build_missing_clusters.py

      # 4i. Per-vertical OG images for proper social-share previews.
      - name: OG images per vertical
        run: uv run python scripts/og_images.py

      # 4i-nav. Universal nav — ensure ALL pages have the correct animated SVG nav.
      # Fixes the bracket/black-bar glitch, removes sp-bg divs.
      - name: Universal nav consistency
        run: uv run python scripts/fix_universal_nav.py
        continue-on-error: true

      # 4i-humanize. Strip em-dashes and AI-tell words that regenerated pages
      # from the ~20 individual generator scripts keep reintroducing.
      - name: Humanize text (strip em-dashes, AI-tell words)
        run: uv run python scripts/humanize_text.py
        continue-on-error: true

      # 4i-ui. Inject saaspare-ui.css into any pages missing it.
      # Without this, engine-generated pages show as plain text (no card styles).
      - name: Inject saaspare-ui.css into pages missing it
        run: uv run python scripts/fix_inject_ui_css.py
        continue-on-error: true

      # 4i-logos. Replace broken SimpleIcons slugs with real brand logos
      # (Google favicon service). ~200 brands were removed from SimpleIcons.
      - name: Fix broken logo URLs with real brand logos
        run: uv run python scripts/fix_logo_urls.py
        continue-on-error: true

      # 4i-theme. Convert light-theme inline blocks (white asides/alerts) emitted
      # by legacy generators to dark-theme equivalents matching the dark site.
      - name: Fix light-theme blocks on dark pages
        run: uv run python scripts/fix_light_theme_blocks.py
        continue-on-error: true

      # 4i-orphan. Remove orphaned </script> tails (leftover JSON-LD fragments)
      # that browsers relocate into <body> as visible stray "]" characters.
      - name: Remove orphaned script tails
        run: uv run python scripts/fix_orphan_script_tails.py
        continue-on-error: true

      # 4i-hero. Move blocks injected inside the hero H1 flex row (squashed
      # skinny column) out to full width below the H1.
      - name: Relocate hero-injected blocks
        run: uv run python scripts/fix_hero_injection_layout.py
        continue-on-error: true

      # 4i-ctr. CTR Optimizer — find pages ranking 8-20 with low CTR,
      # rewrite <title> and <meta description> with power words + year + brackets.
      # Uses data/gsc_export.csv if present, otherwise applies to known opportunity pages.
      - name: CTR optimizer — rewrite weak titles and meta descriptions
        run: uv run python scripts/wave23_ctr_optimizer.py
        continue-on-error: true

      # 4j. Price Intelligence: snapshot 15 tracked vendors and detect diffs.
      - name: Price intelligence track
        run: uv run python scripts/track_pricing.py

      # 4k. Render /pages/[tool]-pricing-history-2026 + buyer-signals roll-up.
      - name: Render pricing history pages
        run: uv run python scripts/render_pricing_history.py

      - name: Render buyer-intel pages
        run: uv run python scripts/render_buyer_intel.py

      # 4z-1. PREMIUM TEMPLATE ENFORCEMENT — run last so these always win over
      # any earlier CI step that generates plain/old-format pages.
      # Best-of pages: ranked tool cards, score rings, jump bar, sidebar.
      - name: Enforce premium best-of template
        run: uv run python scripts/generate_best_of_v3.py
        continue-on-error: true

      # 4z-2. Pricing pages: plan table, hidden costs, true-cost scenarios.
      - name: Enforce premium pricing template
        run: uv run python scripts/generate_pricing_pages_v3.py
        continue-on-error: true

      # 4z-2b. Review pages: score rings, pros/cons, verdict, FAQ.
      - name: Enforce premium review template
        run: uv run python scripts/generate_review_pages_v3.py
        continue-on-error: true

      # 4z-2c. Coupon/promo pages: deal cards, reveal codes, how-to steps.
      - name: Enforce premium coupon template
        run: uv run python scripts/generate_coupon_pages_v3.py
        continue-on-error: true

      # 4z-2d. Free-trial pages: step guide, feature table, what-happens.
      - name: Enforce premium free-trial template
        run: uv run python scripts/generate_free_trial_pages_v3.py
        continue-on-error: true

      # 4z-2e. Pricing-history pages: timeline, buyer guide, scorecard.
      - name: Enforce premium pricing-history template
        run: uv run python scripts/generate_pricing_history_v3.py
        continue-on-error: true

      # 4z-3b. Upgrade all remaining old-template pages (vs, alternatives)
      # with premium CSS shell. Reviews/coupons/trials/history already handled above.
      # Also fixes noindex→index,follow and removes stray "Advertisement" text.
      - name: Upgrade old-template pages to premium design
        run: uv run python scripts/upgrade_old_pages.py
        continue-on-error: true

      # 4z-3c. Ensure every page has the correct animated SVG logo mark.
      # Fixes pages with old text-only logo and injects nav into pages missing it.
      - name: Fix logo and nav consistency across all pages
        run: uv run python scripts/fix_logo_nav.py
        continue-on-error: true

      # 4z-3. Homepage hardening — ensure nav opacity:0 at top and spacer height:0
      # survive any earlier CI step that may have touched index.html.
      - name: Harden homepage nav
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          idx = Path('site/index.html')
          if not idx.exists():
              print('index.html not found')
          else:
              html = idx.read_text(encoding='utf-8', errors='replace')

              # 1. Remove stray ] from body start AND stale </script> tag in head
              # that browsers move to <body> as a text node
              html = re.sub(r'(<body[^>]*>)\s*\]', r'\1', html)
              html = html.replace('\n]</script>\n<style>', '\n<style>')
              html = html.replace('\n]\n</script>\n<style>', '\n<style>')
              html = html.replace(']</script>\n<style>', '<style>')

              # 2. Ensure nav is always visible (transparent at top, frosted on scroll)
              # Remove any old hide-until-scroll rules if CI ever re-introduces them
              html = re.sub(
                  r'/\*[^*]*Nav hidden until scroll[^*]*\*/\s*nav#sp-nav:not\(\.scrolled\)\{[^}]+\}\s*nav#sp-nav\.scrolled\{[^}]+\}',
                  '/* nav always visible */',
                  html
              )
              SHOW_CSS = 'nav#sp-nav{opacity:1!important;pointer-events:auto!important;visibility:visible!important}'
              if 'visibility:visible!important' not in html and 'visibility:hidden!important' not in html:
                  pass  # already clean
              if 'visibility:hidden!important' in html:
                  html = re.sub(r'nav#sp-nav:not\(\.scrolled\)\{[^}]+\}', '', html)
                  html = re.sub(r'nav#sp-nav\.scrolled\{opacity:1!important[^}]+\}', SHOW_CSS, html)

              # 3. Spacer must be 0
              html = html.replace('.sp-nav-spacer{height:72px}', '.sp-nav-spacer{height:0}')
              html = html.replace('.sp-nav-spacer{height: 72px}', '.sp-nav-spacer{height:0}')

              # 4. Fix near-black gradient — old rgba(90,16,28,...) looks black, replace with true red
              html = html.replace(
                  'radial-gradient(ellipse 160% 55% at 50% 0%,rgba(90,16,28,.98) 0%,transparent 42%)',
                  'radial-gradient(ellipse 160% 60% at 50% 0%,rgba(220,45,72,0.82) 0%,rgba(140,20,42,0.55) 20%,rgba(60,8,18,0.3) 35%,transparent 52%)'
              )
              html = html.replace(
                  'radial-gradient(ellipse 140% 70% at 50% 0%,rgba(90,16,28,1) 0%,transparent 55%)',
                  'radial-gradient(ellipse 140% 70% at 50% 0%,rgba(220,45,72,0.92) 0%,rgba(120,18,36,0.7) 25%,transparent 58%)'
              )

              idx.write_text(html, encoding='utf-8')
              print('Homepage hardening applied')
          PYEOF
        continue-on-error: true

      # 4z-3d. Universal nav consistency, FINAL pass. The premium-template
      # generators above (4z-1..4z-2e) render some pages from static files in
      # outputs/templates/ that carry their own frozen nav snapshot - when a
      # generator decides a page still needs (re)rendering, it silently reverts
      # that page's nav to whatever was last saved in the template, undoing the
      # 4i-nav pass earlier in this run. Re-running it here, after every
      # generator, is what actually makes "nav always wins" true end to end.
      - name: Universal nav consistency (final pass)
        run: uv run python scripts/fix_universal_nav.py
        continue-on-error: true

      # 4z-FINAL. Rebuild the sitemap AFTER all page generators have run.
      # The earlier sitemap build (update_sitemap_hubs + update_sitemap_and_index)
      # happens before the best-of/pricing/review/etc. generators create new pages,
      # so freshly generated pages were missing from the sitemap and failing the
      # integrity gate every night. This final rebuild closes that gap.
      - name: Rebuild sitemap after all generators (pre-gate)
        run: uv run python scripts/update_sitemap_and_index.py

      # 5. Comprehensive content QA gate (titles, descs, canonicals, JSON-LD,
      # sitemap, robots, money-page disclosure + sponsored attrs).
      # Hard failures fail the build; soft issues logged to outputs/seo/content_qa.json.
      - name: CI gate - content QA
        run: uv run python scripts/content_qa.py

      # 5. Fail the build if any corruption or schema issue remains.
      - name: CI gate - title / trust-box corruption
        run: uv run pytest tests/test_normalise.py -v

      - name: CI gate - SEO integrity (canonical, sitemap, schema)
        run: uv run pytest tests/test_seo_integrity.py -v

      - name: Run full test suite (best-effort)
        run: uv run pytest -q --ignore=tests/test_seo_integrity.py --ignore=tests/test_normalise.py || true

      # 6. Commit any auto-fixes directly to main.
      # [skip ci] prevents this commit from re-triggering the workflow.
      - name: Commit and push safe auto-fixes
        if: success()
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git add \
            outputs/seo/ \
            site/pages/ \
            site/index.html \
            site/about.html \
            site/contact.html \
            site/deal-radar.html \
            site/shortlist.html \
            site/newsletter.html \
            site/404.html \
            site/media-kit.html \
            site/blog/ \
            site/authors/ \
            site/best-*.html \
            site/sitemap.xml \
            site/_redirects \
            data/public_kpis.json \
            data/ctr_optimizer_report.json \
            || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: nightly site integrity auto-fixes [skip ci]

          - repaired any new title/trust-box corruption
          - resynced public KPI counters (sitemap includes blog/ and authors/)
          - re-injected intent-weighted journey links
          - refreshed manual-review queue for risky factual claims
          - re-applied GA4 affiliate_click tracking to new pages
          - SEO consolidation (canonical dedup)
          - CTR optimizer: rewrote weak titles/metas on position 8-20 pages"
          git pull --rebase -X ours --autostash origin main
          git push
