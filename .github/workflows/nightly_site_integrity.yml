name: Nightly site integrity audit

on:
  # Run every night at 03:17 UTC (~1pm AEST) so reports are ready before
  # the author starts the day.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "site/**/*.html"
      - "scripts/**/*.py"
      - "publisher/**/*.py"
      - "tests/test_normalise.py"
      - "tests/test_seo_integrity.py"

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # 1. Self-healing: remove any "Xero vs. Sageero" style corruption
      # and any "Last verified: <title> is checked..." trust-box bug
      # that sneaks in from content refreshes. Produces a report JSON.
      - name: Repair known corruption patterns
        run: uv run python scripts/fix_corrupted_titles.py

      # 2. Normalise public KPI counts so homepage/about/library/media-kit
      # don't drift out of sync again.
      - name: Sync public KPI counters
        run: uv run python scripts/sync_public_kpis.py

      # 3. Re-apply journey-link block to any new page.
      - name: Inject intent-weighted journey links
        run: uv run python scripts/inject_journey_links.py

      # 4. Flag risky factual claims so the editor has a queue.
      - name: Flag risky factual claims
        run: uv run python scripts/flag_risky_claims.py

      # 4b. Keep Amazon Associates links correct (idempotent, safe to re-run).
      - name: Fix Amazon Associates links
        run: uv run python scripts/fix_amazon_links.py

      # 5. Fail the build if any corruption or schema issue remains.
      - name: CI gate - title / trust-box corruption
        run: uv run pytest tests/test_normalise.py -v

      - name: CI gate - SEO integrity (canonical, sitemap, schema)
        run: uv run pytest tests/test_seo_integrity.py -v

      - name: Run full test suite (best-effort)
        run: uv run pytest -q --ignore=tests/test_seo_integrity.py --ignore=tests/test_normalise.py || true

      # 6. Commit any auto-fixes directly to main.
      # [skip ci] prevents this commit from re-triggering the workflow.
      - name: Commit and push safe auto-fixes
        if: success()
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git add \
            outputs/seo/ \
            site/pages/ \
            site/index.html \
            site/about.html \
            site/media-kit.html \
            data/public_kpis.json \
            || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: nightly site integrity auto-fixes [skip ci]

          - repaired any new title/trust-box corruption
          - resynced public KPI counters
          - re-injected intent-weighted journey links
          - refreshed manual-review queue for risky factual claims"
          git pull --rebase --autostash origin main
          git push
