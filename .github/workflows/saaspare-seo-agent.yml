name: SaaSpare SEO Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SEO agent mode: audit or apply-safe"
        default: "audit"
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: saaspare-seo-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://saaspare.org
      GSC_SITE_URL: https://saaspare.org
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run SEO agent
        run: uv run python scripts/seo/seo_agent.py --mode ${{ github.event.inputs.mode || 'audit' }}

      - name: Run tests
        run: uv run pytest -q

      - name: Build PR body
        run: |
          {
            echo "## SaaSpare SEO Agent"
            echo
            echo "- Mode: \`${{ github.event.inputs.mode || 'audit' }}\`"
            echo "- Reports generated under \`seo/reports/\`"
            echo "- Tests: \`uv run pytest -q\`"
            echo
            echo "## Health Summary"
            sed -n '1,80p' seo/reports/site-health.md || true
          } > seo-pr-body.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: seo-agent/automated-${{ github.run_id }}
          title: SEO Agent: automated SaaSpare improvements - ${{ github.run_id }}
          body-path: seo-pr-body.md
          commit-message: SEO Agent: automated audit and safe fixes
          labels: seo, automation
          delete-branch: true
