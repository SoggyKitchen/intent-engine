name: Weekly Newsletter

permissions:
  contents: write

on:
  schedule:
    - cron: "0 10 * * 5"    # Every Friday 10 AM UTC
  workflow_dispatch:

concurrency:
  group: intent-engine-stateful
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate and send newsletter
        run: uv run engine newsletter
        env:
          DB_PATH: data/intent.db
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
          CEREBRAS_API_KEY_6: ${{ secrets.CEREBRAS_API_KEY_6 }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          DRY_RUN: ${{ secrets.DRY_RUN }}

      - name: Inject capture forms into new pages
        run: uv run engine inject-forms
        env:
          DB_PATH: data/intent.db
          EMAIL_FORM_ACTION: ${{ secrets.EMAIL_FORM_ACTION }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Commit
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git pull --rebase --autostash origin main
          git add outputs/generated/ site/pages/ || true
          git diff --staged --quiet || git commit -m "chore: newsletter+forms $(date -u +%Y-%m-%d) [skip ci]"
          git push
