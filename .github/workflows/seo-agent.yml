name: SaaSpare SEO Agent

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-agent.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "SEO agent mode"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - apply-safe
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: seo-agent-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://saaspare.org
      GSC_SITE_URL: https://saaspare.org
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package
        run: python -m pip install uv

      - name: Select SEO mode
        run: |
          SEO_MODE="${{ github.event.inputs.mode }}"
          if [ -z "$SEO_MODE" ]; then
            SEO_MODE="audit"
          fi
          echo "SEO_MODE=$SEO_MODE" >> "$GITHUB_ENV"

      - name: Run SEO agent
        run: npm run seo:agent -- --mode="$SEO_MODE"

      - name: Run tests
        run: uv run pytest -q

      - name: Build PR body
        run: |
          {
            echo "## SaaSpare SEO Agent"
            echo
            echo "- Mode: \`$SEO_MODE\`"
            echo "- Reports generated under \`seo/reports/\`"
            echo "- Tests: \`uv run pytest -q\`"
            echo
            echo "## Health Summary"
            sed -n '1,80p' seo/reports/site-health.md || true
          } > seo-pr-body.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: seo-agent/automated-${{ github.run_id }}
          title: SEO Agent: automated SaaSpare improvements - ${{ github.run_id }}
          body-path: seo-pr-body.md
          commit-message: SEO Agent: automated audit and safe fixes
          labels: seo, automation
          delete-branch: true
