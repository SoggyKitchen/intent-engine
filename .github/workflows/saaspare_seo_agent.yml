name: SaaSpare SEO Agent

on:
  workflow_dispatch:
  schedule:
    # Daily 03:17 UTC (~13:17 Brisbane) — pull fresh GSC opportunities every day.
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run SEO audit
        env:
          # Force domain-property format. The OAuth user has access to the
          # sc-domain property, NOT the https:// URL-prefix property (that 403s).
          GSC_SITE_URL: 'sc-domain:saaspare.org'
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: uv run python scripts/seo/seo_agent.py --mode audit

      - name: Run revenue intelligence
        run: uv run python scripts/seo/revenue_intelligence.py

      - name: Run tests
        run: uv run pytest -q

      - name: Commit fresh GSC + audit reports
        run: |
          git config user.name "saaspare-seo-agent"
          git config user.email "agent@saaspare.org"
          git add seo/reports/ seo/snapshots/ || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "ceo-daily: refresh GSC opportunities + SEO audit reports [skip ci]"
            git push
          fi
