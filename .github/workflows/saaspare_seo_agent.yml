name: SaaSpare SEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run SEO audit
        run: uv run python scripts/seo/seo_agent.py --mode audit

      - name: Run tests
        run: uv run pytest -q
