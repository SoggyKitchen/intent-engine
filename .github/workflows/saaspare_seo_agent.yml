name: SaaSpare SEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run SEO audit
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:saaspare.org' }}
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: uv run python scripts/seo/seo_agent.py --mode audit

      - name: Run tests
        run: uv run pytest -q
