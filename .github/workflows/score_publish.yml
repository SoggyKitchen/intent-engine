name: Score & Publish

on:
  schedule:
    - cron: "30 6 * * *"    # 6:30 AM UTC
    - cron: "30 12 * * *"   # 12:30 PM UTC
    - cron: "30 18 * * *"   # 6:30 PM UTC
    - cron: "30 23 * * *"   # 11:30 PM UTC
  workflow_dispatch:

concurrency:
  group: intent-engine-stateful
  cancel-in-progress: false

jobs:
  score-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Init database
        run: uv run engine init
        env:
          DB_PATH: data/intent.db

      - name: Score signals
        run: uv run engine score
        env:
          DB_PATH: data/intent.db
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
          CEREBRAS_API_KEY_6: ${{ secrets.CEREBRAS_API_KEY_6 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCORE_BATCH_SIZE: "40"
          LOG_LEVEL: INFO
          MONETIZATION_MODE: ${{ secrets.MONETIZATION_MODE }}

      - name: Generate & publish outputs
        run: uv run engine publish
        env:
          DB_PATH: data/intent.db
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
          CEREBRAS_API_KEY_6: ${{ secrets.CEREBRAS_API_KEY_6 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
          CF_PAGES_REPO: ${{ secrets.CF_PAGES_REPO }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          MONETIZATION_MODE: ${{ secrets.MONETIZATION_MODE }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          LOG_LEVEL: INFO

      - name: Refresh site artifacts
        run: uv run engine programmatic --max-pages 0
        env:
          DB_PATH: data/intent.db
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
          CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
          CEREBRAS_API_KEY_6: ${{ secrets.CEREBRAS_API_KEY_6 }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          LOG_LEVEL: INFO

      - name: Run optimizer
        run: uv run engine optimize
        env:
          DB_PATH: data/intent.db
          LOG_LEVEL: INFO

      - name: Submit backlinks + IndexNow
        run: uv run engine backlinks
        env:
          DB_PATH: data/intent.db
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          DRY_RUN: ${{ secrets.DRY_RUN }}

      - name: Post to social media
        run: uv run engine social
        continue-on-error: true
        env:
          DB_PATH: data/intent.db
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          DRY_RUN: ${{ secrets.DRY_RUN }}

      - name: Print stats
        run: uv run engine stats
        env:
          DB_PATH: data/intent.db

      - name: Commit DB and generated files
        run: |
          git config user.email "bot@intentengine.local"
          git config user.name "IntentBot"
          git pull --rebase --autostash origin main
          git add data/intent.db outputs/generated/ site/pages/ site/index.html site/sitemap.xml site/_redirects || true
          git diff --staged --quiet || git commit -m "chore: score+publish $(date -u +%Y-%m-%d) [skip ci]"
          git push
