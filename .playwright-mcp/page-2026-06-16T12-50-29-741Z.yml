                - generic [ref=e185]:
                  - paragraph [ref=e186]: We get accurate backlink data by crawling the web with our own web crawler, storing the backlinks we find in a large, frequently updated database, and cleaning and assessing that data before you see it.
                  - paragraph [ref=e187]: Our crawler visits billions of pages, finds new links, and adds them to a backlink index of more than 43 trillion backlinks and 390 million referring domains.
                  - paragraph [ref=e188]: This is the same database that powers Backlink Analytics and the rest of our SEO tools.
                  - paragraph [ref=e189]: The database is refreshed at least hourly, so when you check backlinks, you're working with the most recent data for your site and your competitors.
                  - paragraph [ref=e190]: To keep the data accurate, we remove duplicate links, filter out obvious noise, and calculate Authority Score using signals like backlink quality and quantity, estimated organic traffic, and signs of manipulation.
                  - paragraph [ref=e191]: This process reduces bad, inaccurate data and keeps each site's backlink profile as reliable as possible.
